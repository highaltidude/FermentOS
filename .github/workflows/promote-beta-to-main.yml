name: Promote beta to main

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write
  # To check which referenced issues are still open.
  issues: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open or update beta -> main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          COMMITS="$(git log origin/main..origin/beta --oneline)"
          if [ -z "$COMMITS" ]; then
            echo "beta is not ahead of main — nothing to promote."
            exit 0
          fi

          BODY="Commits being promoted from beta to main:

          $COMMITS"

          # Fix commits carry a "Fixes #N" trailer. GitHub only acts on it
          # once the commit reaches main, so list the open issues here: they
          # show under the PR's Development sidebar and close when it merges.
          RESOLVES=""
          for N in $(git log origin/main..origin/beta --format=%B \
                       | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
                       | grep -oE '[0-9]+$' | sort -un); do
            if ! OPEN="$(gh api "repos/$GITHUB_REPOSITORY/issues/$N" \
                           --jq 'select(.pull_request == null and .state == "open") | .number' 2>/dev/null)"; then
              echo "::warning::Couldn't look up #$N, referenced by a promoted commit; skipping it."
              continue
            fi
            if [ -n "$OPEN" ]; then RESOLVES="${RESOLVES}Closes #${OPEN}"$'\n'; fi
          done
          if [ -n "$RESOLVES" ]; then
            BODY="$BODY

          Issues this promotion resolves (closed when merged):

          $RESOLVES"
            echo "Resolves:"; printf '%s' "$RESOLVES"
          fi

          EXISTING="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head beta --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "Updated existing PR #$EXISTING"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head beta \
              --title "chore: promote beta to main" --body "$BODY"
          fi
