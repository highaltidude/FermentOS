name: Sync main to beta

# Keeps beta from drifting behind main. Runs on every push to main (a
# beta->main promotion merge, a release-please version-bump commit, or a
# hotfix landed directly on main) and merges that content into beta.
#
# This is a direct merge + push, not a PR: anything reaching main already
# went through review (either the promote-beta-to-main PR, or its own
# hotfix PR), so re-reviewing it a second time on the way into beta adds
# a manual click with no real safety benefit. If a genuine conflict comes
# up (beta diverged on the same lines independently), the merge step fails
# and the job goes red instead of pushing anything broken.

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0
          # Pushes made with the default GITHUB_TOKEN don't trigger other
          # workflows (GitHub's anti-recursion guardrail) — without this,
          # the anchor commit below lands on beta but release-beta.yml never
          # re-runs to pick it up, leaving the beta release PR stale. A PAT
          # is a normal user token, so its pushes cascade like any other.
          # Falls back to the default token if SYNC_PAT isn't set, so this
          # keeps working (without cascading) until the secret is added.
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Merge main into beta
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Anchor beta prerelease to main's version
        id: anchor
        # config-beta.json uses release-please's "prerelease" versioning
        # strategy: once a manifest version has a prerelease suffix, it only
        # ever increments the trailing -betaN counter and never recomputes
        # the X.Y.Z base from commit types. Left alone, beta stays on
        # whatever base it was bootstrapped with forever (it sat at
        # 1.0.0-beta1..5 while main went 1.0.0 -> 1.1.2). Whenever main's
        # released version moves past beta's current base, reset beta's
        # manifest to "<main-version>-beta1" so the next beta release reads
        # as a prerelease of the version beta is actually built on. This is
        # release-please's documented way to force the next version: editing
        # the manifest directly. A matching release IS required though:
        # release-please finds its commit-range boundary by looking up the
        # release whose tag matches the manifest version, so anchoring to a
        # version that was never released left it unable to find one and it
        # scanned far further back. That is why past post-promotion beta
        # releases carried 79-83 changelog entries reaching into already-shipped
        # work. The publish step below closes that gap.
        run: |
          set -euo pipefail
          MANIFEST=.github/release-please/manifest-beta.json
          MAIN_VERSION=$(jq -r '."."' .github/release-please/manifest-main.json)
          BETA_VERSION=$(jq -r '."."' "$MANIFEST")
          BETA_BASE=$(echo "$BETA_VERSION" | sed -E 's/-beta[0-9]+$//')

          if [ "$MAIN_VERSION" != "$BETA_BASE" ] && \
             [ "$(printf '%s\n%s\n' "$MAIN_VERSION" "$BETA_BASE" | sort -V | tail -n1)" = "$MAIN_VERSION" ]; then
            echo "Anchoring beta ($BETA_VERSION) to main's v$MAIN_VERSION"
            jq --arg v "${MAIN_VERSION}-beta1" '."." = $v' "$MANIFEST" > "$MANIFEST.tmp"
            mv "$MANIFEST.tmp" "$MANIFEST"
            git add "$MANIFEST"
            git commit -m "chore(beta): anchor prerelease version to v${MAIN_VERSION}"
            echo "anchored=true" >> "$GITHUB_OUTPUT"
            echo "version=${MAIN_VERSION}-beta1" >> "$GITHUB_OUTPUT"
          else
            echo "anchored=false" >> "$GITHUB_OUTPUT"
            echo "Beta ($BETA_VERSION) already anchored at or ahead of main's v$MAIN_VERSION — nothing to do"
          fi

      - name: Push beta
        run: git push origin beta

      - name: Publish the anchor as a prerelease
        # Gives release-please the boundary it looks for. Without a release
        # matching the manifest version it cannot tell where the new beta cycle
        # starts, and the next beta changelog reaches back through months of
        # already-released history.
        #
        # Runs after the push so the commit exists on the remote for the tag to
        # point at. Marked prerelease so it never displaces the stable release.
        if: steps.anchor.outputs.anchored == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || github.token }}
          TAG: fermentos-v${{ steps.anchor.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          # Built with jq rather than inline quoting so the body can't break the JSON.
          jq -n --arg tag "$TAG" --arg sha "$SHA" \
            --arg body "Beta rebased onto main's release. Marks the commit-range boundary for subsequent beta releases." \
            '{tag_name: $tag, target_commitish: $sha, name: $tag, body: $body, prerelease: true}' \
            | curl -fsS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$REPO/releases" \
                -d @- > /dev/null
          echo "Published $TAG at $SHA as the beta commit-range boundary"
