    NotificationChannel:
      type: string
      description: "none disables notifications entirely."
      enum: [none, ntfy, webhook]

    NotificationSettings:
      type: object
      description: >-
        Outbound notification config. Both channels are plain outbound POSTs,
        so they work on a plain-HTTP LAN deployment with no certificates.
      properties:
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        ntfyServer:
          type: string
          description: Base URL of the ntfy server. Defaults to https://ntfy.sh.
        ntfyTopic:
          type: string
          description: ntfy topic to publish to. Treat as a secret — anyone who knows it can read your alerts.
        webhookUrl:
          type: string
          description: URL to POST a JSON payload to. Also covers Discord and Slack incoming webhooks.
        types:
          type: array
          description: Which alert types should notify.
          items:
            $ref: "#/components/schemas/AlertType"
        repeatHours:
          type: integer
          minimum: 1
          maximum: 168
          description: Minimum hours between repeat notifications while a condition stays active.
        tempRepeatHours:
          type: integer
          minimum: 1
          maximum: 168
          nullable: true
          description: >-
            Overrides repeatHours for temp_out_of_range only. Null inherits it,
            which is the default. A temperature excursion is actionable straight
            away, so it often warrants a shorter interval than the rest.
        boilAlerts:
          type: boolean
          description: >-
            Notify at each hop addition and at flameout while a boil timer is
            running. Kept out of types because it is a one-shot schedule, not a
            monitored condition, and so an existing saved types list does not
            leave it switched off on upgrade. Defaults to true.
        dryHopAlerts:
          type: boolean
          description: >-
            Remind when a dry hop addition comes due during conditioning, and
            keep reminding every dryHopRepeatHours until it is marked added.
            Kept out of types for the same reason as boilAlerts. Defaults to true.
        dryHopRepeatHours:
          type: integer
          minimum: 1
          maximum: 168
          description: Hours between dry hop reminders while an addition is still due. Defaults to 6.
        autoAdvanceAlerts:
          type: boolean
          description: >-
            Notify once when a batch is moved to Conditioning automatically.
            Kept out of types for the same reason as boilAlerts. Defaults to true.
      required: [channel, ntfyServer, ntfyTopic, webhookUrl, types, repeatHours]

