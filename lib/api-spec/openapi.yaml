        notes:
          type: string
          nullable: true
        variants:
          type: array
          nullable: true
          description: Which of the recipe's versions this ingredient belongs to. Null means every version.
          items:
            $ref: "#/components/schemas/RecipeVariant"
      required: [id, recipeId, name, type, amount, unit]

    CreateRecipeIngredientBody:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IngredientType"
        amount:
          type: number
        unit:
          type: string
        use:
          $ref: "#/components/schemas/IngredientUse"
          nullable: true
        timingMinutes:
          type: integer
          nullable: true
        dryHopDay:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Dry hops only. Days after the batch enters conditioning to add it,
            0 being the day conditioning starts. Drives the dry hop reminder.
        notes:
          type: string
          nullable: true
        variants:
          type: array
          nullable: true
          description: Which of the recipe's versions this ingredient belongs to. Null or omitted means every version.
          items:
            $ref: "#/components/schemas/RecipeVariant"
