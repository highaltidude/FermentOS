    UpdateRecipeIngredientBody:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IngredientType"
        amount:
          type: number
        unit:
          type: string
        use:
          $ref: "#/components/schemas/IngredientUse"
          nullable: true
        timingMinutes:
          type: integer
          nullable: true
        dryHopDay:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Dry hops only. Days after the batch enters conditioning to add it,
