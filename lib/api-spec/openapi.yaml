      required: [name, category]

    UpdateEquipmentBody:
      type: object
      properties:
        name:
          type: string
        brand:
          type: string
        model:
          type: string
        category:
          type: string
        purchasedDate:
          type: string
          format: date
        purchasePrice:
          type: string
        condition:
          $ref: "#/components/schemas/EquipmentCondition"
        serialNumber:
          type: string
        notes:
          type: string

    BeerStyle:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, sortOrder, createdAt]

    CreateBeerStyleBody:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer
      required: [name]

    PhotoUploadResult:
      type: object
      properties:
        photoPath:
          type: string
      required: [photoPath]

    # ── Sensor schemas ─────────────────────────────────────────────────────
    SensorDevice:
      type: object
      properties:
        id:
          type: integer
        deviceType:
          type: string
        deviceName:
          type: string
        deviceKey:
          type: string
        enabled:
          type: boolean
        notes:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, deviceType, deviceName, deviceKey, enabled, createdAt, updatedAt]

    SensorReading:
      type: object
      properties:
        id:
          type: integer
        deviceId:
          type: integer
        brewSessionId:
          type: integer
          nullable: true
        gravity:
          type: number
          nullable: true
        temperature:
          type: number
          nullable: true
        temperatureUnit:
          type: string
          nullable: true
        angle:
          type: number
          nullable: true
        battery:
          type: number
          nullable: true
        batteryPercentEstimate:
          type: number
          nullable: true
          description: Estimated battery percentage using a non-linear Li-ion discharge curve (0–100)
        rssi:
          type: integer
          nullable: true
        reportedInterval:
          type: integer
          nullable: true
        rawPayload:
          type: object
          additionalProperties: true
          nullable: true
        receivedAt:
          type: string
          format: date-time
      required: [id, deviceId, receivedAt]

    ISpindelReadingsPage:
      type: object
      properties:
        readings:
          type: array
          items:
            $ref: "#/components/schemas/SensorReading"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [readings, total, limit, offset]

    SensorAlert:
      type: object
      properties:
        type:
          type: string
          enum: [gravity_stalled, temp_out_of_range, battery_low, device_offline]
        message:
          type: string
        triggeredAt:
          type: string
          format: date-time
      required: [type, message, triggeredAt]

    FermentationInsights:
      type: object
      properties:
        startingGravity:
          type: number
          nullable: true
        currentGravity:
          type: number
          nullable: true
        gravityDrop:
          type: number
          nullable: true
        attenuationPercent:
          type: number
          nullable: true
        fermentationStatus:
          type: string
          enum: [likely_active, slowing, stable, possibly_complete, insufficient_data]
        velocityLast24h:
          type: number
          nullable: true
          description: Gravity points dropped per day over the last 24 h
      required: [fermentationStatus]

    SensorDeviceWithStatus:
      type: object
      properties:
        device:
          $ref: "#/components/schemas/SensorDevice"
        latestReading:
          $ref: "#/components/schemas/SensorReading"
          nullable: true
        assignedBrewSessionId:
          type: integer
          nullable: true
        assignedBrewName:
          type: string
          nullable: true
        connectionStatus:
          type: string
          enum: [connected, warning, offline, unknown]
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/SensorAlert"
      required: [device, connectionStatus, alerts]

    BrewSensorTelemetry:
      type: object
      properties:
        brewSessionId:
          type: integer
        device:
          $ref: "#/components/schemas/SensorDevice"
          nullable: true
        latestReading:
          $ref: "#/components/schemas/SensorReading"
          nullable: true
        readings:
          type: array
          items:
            $ref: "#/components/schemas/SensorReading"
        insights:
          $ref: "#/components/schemas/FermentationInsights"
          nullable: true
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/SensorAlert"
      required: [brewSessionId, readings, alerts]

    ISpindelPayload:
      type: object
      properties:
        name:
          type: string
        ID:
          type: integer
        token:
          type: string
        temperature:
          type: number
        temp_units:
          type: string
        angle:
          type: number
        gravity:
          type: number
        battery:
          type: number
        interval:
          type: integer
        RSSI:
          type: integer

    ISpindelSettings:
      type: object
      properties:
        enabled:
          type: boolean
        token:
          type: string
          nullable: true
          description: If set, inbound payloads must include this token value
      required: [enabled]

    SimulateReadingBody:
      type: object
      properties:
        deviceId:
          type: integer
          nullable: true
          description: Existing device id. If omitted a temporary device is used.
        brewSessionId:
          type: integer
          nullable: true
        deviceName:
          type: string
        gravity:
          type: number
        temperature:
          type: number
        temperatureUnit:
          type: string
        battery:
          type: number
        angle:
          type: number
        rssi:
          type: integer
      required: [gravity, temperature]

    CreateSensorDeviceBody:
      type: object
      properties:
        deviceType:
          type: string
          default: ispindel
        deviceName:
          type: string
        deviceKey:
          type: string
        notes:
          type: string
      required: [deviceName, deviceKey]

    UpdateSensorDeviceBody:
      type: object
      properties:
        deviceName:
          type: string
        deviceKey:
          type: string
        enabled:
          type: boolean
        notes:
          type: string

    AssignDeviceBody:
      type: object
      properties:
        brewSessionId:
          type: integer
      required: [brewSessionId]

    HaLatestReading:
      type: object
      properties:
        gravity:
          type: number
          nullable: true
        temperature:
          type: number
          nullable: true
        temperatureUnit:
          type: string
          nullable: true
        battery:
          type: number
          nullable: true
        batteryPercentEstimate:
          type: number
          nullable: true
        angle:
          type: number
          nullable: true
        rssi:
          type: integer
          nullable: true
        receivedAt:
          type: string
          format: date-time
      required: [receivedAt]

    HaInsights:
      type: object
      properties:
        fermentationStatus:
          type: string
          enum: [likely_active, slowing, stable, possibly_complete, insufficient_data]
        attenuationPercent:
          type: number
          nullable: true
        gravityDrop:
          type: number
          nullable: true
        startingGravity:
          type: number
          nullable: true
        currentGravity:
          type: number
          nullable: true
        velocityLast24h:
          type: number
          nullable: true
      required: [fermentationStatus]

    HaDevice:
      type: object
      properties:
        deviceId:
          type: integer
        deviceName:
          type: string
        deviceKey:
          type: string
        connectionStatus:
          type: string
          enum: [connected, warning, offline, unknown]
        assignedBrewSessionId:
          type: integer
          nullable: true
        assignedBrewName:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        latestReading:
          $ref: "#/components/schemas/HaLatestReading"
          nullable: true
        insights:
          $ref: "#/components/schemas/HaInsights"
          nullable: true
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/SensorAlert"
      required: [deviceId, deviceName, deviceKey, connectionStatus, alerts]

    HaStatusResponse:
      type: array
      items:
        $ref: "#/components/schemas/HaDevice"

    SystemStats:
      type: object
      properties:
        hostname:
          type: string
        uptime:
          type: integer
        loadAvg:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        cpu:
          type: object
          properties:
            model:
              type: string
            cores:
              type: integer
            usagePercent:
              type: integer
              nullable: true
          required: [model, cores, usagePercent]
        memory:
          type: object
          properties:
            totalMB:
              type: integer
            usedMB:
              type: integer
            freeMB:
              type: integer
            usedPercent:
              type: integer
          required: [totalMB, usedMB, freeMB, usedPercent]
        disk:
          type: object
          nullable: true
          properties:
            totalGB:
              type: number
            usedGB:
              type: number
            freeGB:
              type: number
            usedPercent:
              type: integer
          required: [totalGB, usedGB, freeGB, usedPercent]
        network:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              rxBytes:
                type: integer
              txBytes:
                type: integer
              rxBytesPerSec:
                type: integer
              txBytesPerSec:
                type: integer
            required: [name, rxBytes, txBytes, rxBytesPerSec, txBytesPerSec]
        temperatureCelsius:
          type: number
          nullable: true
        containerMemoryLimitMB:
          type: integer
          nullable: true
        isDocker:
          type: boolean
      required:
        [
          hostname,
          uptime,
          loadAvg,
          cpu,
          memory,
          disk,
          network,
          temperatureCelsius,
          containerMemoryLimitMB,
          isDocker,
        ]

    SystemHealthSample:
      type: object
      properties:
        id:
          type: integer
        sampledAt:
          type: string
          format: date-time
        cpuPercent:
          type: number
          nullable: true
        memoryPercent:
          type: number
        diskPercent:
          type: number
          nullable: true
        temperatureCelsius:
          type: number
          nullable: true
      required:
        [id, sampledAt, cpuPercent, memoryPercent, diskPercent, temperatureCelsius]
