        message:
          type: string
        ingredientIndex:
          type: integer
          nullable: true
          description: Index into the draft's ingredients, when the warning is about one.
        sourceText:
          type: string
          nullable: true
      required: [code, message]

    KitSheetYeast:
      type: object
      properties:
        lab:
          type: string
        name:
          type: string
      required: [lab, name]

    KitSheetDraftIngredient:
      type: object
      description: >-
        An ingredient as read from the sheet. Unlike a saved ingredient, amount,
        unit and use may be null when the sheet does not state them.
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/IngredientType"
        amount:
          type: number
          nullable: true
        unit:
          type: string
          nullable: true
        use:
          $ref: "#/components/schemas/IngredientUse"
          nullable: true
        timingMinutes:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        variants:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/RecipeVariant"
        sourceText:
