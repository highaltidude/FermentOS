openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FermentOS API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: recipes
    description: Beer recipe management
  - name: ingredients
    description: Recipe ingredient management
  - name: steps
    description: Step-by-step brewing instructions for recipes
  - name: brew-sessions
    description: Brew session tracking
  - name: fermentation
    description: Fermentation readings
  - name: inventory
    description: Ingredient inventory management
  - name: dashboard
    description: Dashboard and summary data
  - name: settings
    description: App settings (beer styles, etc.)
  - name: sensors
    description: Sensor device management (iSpindel, Tilt, RAPT Pill, etc.)
  - name: integrations
    description: Third-party device integrations and telemetry ingest
  - name: flows
    description: Brew Flows — automations that switch relays from temperature or a schedule
  - name: devices
    description: Relay devices FermentOS switches (Shelly Gen1)
  - name: system
    description: Host system stats and health history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/active-brews:
    get:
      operationId: getActiveBrews
      tags: [dashboard]
      summary: Get active brew sessions with latest fermentation data
      responses:
        "200":
          description: Active brew sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActiveBrew"

  /dashboard/upcoming-brews:
    get:
      operationId: getUpcomingBrews
      tags: [dashboard]
      summary: Get scheduled brew sessions sorted by brew date ascending
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Upcoming scheduled brew sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UpcomingBrew"

  /recipes:
    get:
      operationId: listRecipes
      tags: [recipes]
      summary: List all recipes
      parameters:
        - name: style
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of recipes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recipe"
    post:
      operationId: createRecipe
      tags: [recipes]
      summary: Create a new recipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeBody"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"

  /recipes/styles:
    get:
      operationId: getRecipeStyles
      tags: [recipes]
      summary: Get recipe counts grouped by beer style
      responses:
        "200":
          description: Recipe style breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleCount"

  /recipes/import:
    post:
      operationId: importRecipe
      tags: [recipes]
      summary: Create a recipe together with its ingredients and steps
      description: >-
        Everything is inserted in one transaction, so a rejected ingredient
        leaves no half-built recipe behind. This is also the only way to create
        a recipe with several versions (LME / DME / all-grain).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRecipeBody"
      responses:
        "201":
          description: Recipe created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "400":
          description: Invalid body, or an ingredient names a version the recipe does not have
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /recipes/import/morebeer/parse:
    post:
      operationId: parseMorebeerKitSheet
      tags: [recipes]
      summary: Read a MoreBeer kit-sheet PDF into a recipe draft
      description: >-
        Send the PDF as the raw request body. Nothing is saved: the draft is
        returned for review and then posted to /recipes/import.
      requestBody:
        required: true
        content:
          application/pdf:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Parsed draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitSheetDraft"
        "400":
          description: The body is not a PDF, or is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: A PDF, but not one that could be read as a kit sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KitSheetParseError"

  /recipes/{id}:
    get:
      operationId: getRecipe
      tags: [recipes]
      summary: Get a recipe by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeWithIngredients"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateRecipe
      tags: [recipes]
      summary: Update a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeBody"
      responses:
        "200":
          description: Updated recipe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteRecipe
      tags: [recipes]
      summary: Delete a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /recipes/{id}/ingredients:
    get:
      operationId: listRecipeIngredients
      tags: [ingredients]
      summary: List ingredients for a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of ingredients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeIngredient"
    post:
      operationId: addRecipeIngredient
      tags: [ingredients]
      summary: Add an ingredient to a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeIngredientBody"
      responses:
        "201":
          description: Ingredient added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeIngredient"

  /ingredients/{id}:
    put:
      operationId: updateRecipeIngredient
      tags: [ingredients]
      summary: Update a recipe ingredient
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeIngredientBody"
      responses:
        "200":
          description: Updated ingredient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeIngredient"
    delete:
      operationId: deleteRecipeIngredient
      tags: [ingredients]
      summary: Delete a recipe ingredient
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /recipes/{id}/steps:
    get:
      operationId: listRecipeSteps
      tags: [steps]
      summary: List ordered brewing steps for a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of steps (ordered by position)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeStep"
    post:
      operationId: addRecipeStep
      tags: [steps]
      summary: Append a brewing step to a recipe
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecipeStepBody"
      responses:
        "201":
          description: Step created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeStep"

  /steps/{id}:
    put:
      operationId: updateRecipeStep
      tags: [steps]
      summary: Update a brewing step
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecipeStepBody"
      responses:
        "200":
          description: Updated step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeStep"
    delete:
      operationId: deleteRecipeStep
      tags: [steps]
      summary: Delete a brewing step
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /recipes/{id}/steps/reorder:
    put:
      operationId: reorderRecipeSteps
      tags: [steps]
      summary: Replace the ordering of a recipe's steps
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRecipeStepsBody"
      responses:
        "200":
          description: Reordered steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecipeStep"

  /brew-sessions:
    get:
      operationId: listBrewSessions
      tags: [brew-sessions]
      summary: List all brew sessions
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/BrewStatus"
        - name: recipeId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of brew sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrewSession"
    post:
      operationId: createBrewSession
      tags: [brew-sessions]
      summary: Create a new brew session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBrewSessionBody"
      responses:
        "201":
          description: Brew session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSession"

  /brew-sessions/{id}:
    get:
      operationId: getBrewSession
      tags: [brew-sessions]
      summary: Get a brew session by ID
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Brew session with readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSessionWithReadings"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateBrewSession
      tags: [brew-sessions]
      summary: Update a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBrewSessionBody"
      responses:
        "200":
          description: Updated brew session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSession"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBrewSession
      tags: [brew-sessions]
      summary: Delete a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /brew-sessions/{id}/rating:
    put:
      operationId: upsertBrewRating
      tags: [brew-sessions]
      summary: Save the tasting scorecard for a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertBrewRatingBody"
      responses:
        "200":
          description: Scorecard saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSession"
        "404":
          description: Brew session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteBrewRating
      tags: [brew-sessions]
      summary: Clear the tasting scorecard for a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Scorecard cleared

  /brew-sessions/{id}/boil:
    post:
      operationId: controlBoil
      tags: [brew-sessions]
      summary: Start, pause, resume, finish or reset the boil timer, or save its checklist
      description: >-
        The timer lives on the server so every device shows the same countdown
        and hop-addition notifications fire even when no page is open.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoilControlBody"
      responses:
        "200":
          description: Updated brew session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSession"
        "400":
          description: Invalid action for the current timer state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Brew session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brew-sessions/{id}/dry-hops:
    get:
      operationId: getBrewSessionDryHops
      tags: [brew-sessions]
      summary: The recipe's dry hop schedule for this brew, with due dates and status
      description: >-
        Days are counted from when the batch last entered conditioning. Only
        dry hops with a day set are listed.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Dry hop schedule, sorted by day
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DryHopScheduleItem"
        "404":
          description: Brew session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brew-sessions/{id}/dry-hops/{ingredientId}/added:
    parameters:
      - $ref: "#/components/parameters/IdParam"
      - name: ingredientId
        in: path
        required: true
        schema:
          type: integer
    post:
      operationId: markDryHopAdded
      tags: [brew-sessions]
      summary: Mark a dry hop as added, which clears its reminder
      responses:
        "200":
          description: Updated dry hop schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DryHopScheduleItem"
        "404":
          description: Brew session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unmarkDryHopAdded
      tags: [brew-sessions]
      summary: Undo marking a dry hop as added
      responses:
        "200":
          description: Updated dry hop schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DryHopScheduleItem"
        "404":
          description: Brew session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brew-sessions/{id}/readings:
    get:
      operationId: listFermentationReadings
      tags: [fermentation]
      summary: List fermentation readings for a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: List of fermentation readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FermentationReading"
    post:
      operationId: addFermentationReading
      tags: [fermentation]
      summary: Add a fermentation reading
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFermentationReadingBody"
      responses:
        "201":
          description: Reading added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FermentationReading"

  /readings/{id}:
    delete:
      operationId: deleteFermentationReading
      tags: [fermentation]
      summary: Delete a fermentation reading
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /status-log/{id}:
    delete:
      operationId: deleteStatusLogEntry
      tags: [brew-sessions]
      summary: Delete a status log entry
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /settings/styles:
    get:
      operationId: listBeerStyles
      tags: [settings]
      summary: List all beer styles
      responses:
        "200":
          description: List of beer styles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BeerStyle"
    post:
      operationId: createBeerStyle
      tags: [settings]
      summary: Create a beer style
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBeerStyleBody"
      responses:
        "201":
          description: Beer style created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BeerStyle"

  /settings/styles/{id}:
    delete:
      operationId: deleteBeerStyle
      tags: [settings]
      summary: Delete a beer style
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /settings/unit-system:
    get:
      operationId: getUnitSystem
      tags: [settings]
      summary: Get the unit system preference
      responses:
        "200":
          description: Current unit system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitSystemResponse"
    put:
      operationId: setUnitSystem
      tags: [settings]
      summary: Set the unit system preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitSystemBody"
      responses:
        "200":
          description: Updated unit system
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitSystemResponse"

  /settings/source-water:
    get:
      operationId: getSourceWater
      tags: [settings]
      summary: Get the saved source (tap) water profile
      responses:
        "200":
          description: Saved source water, or null when none has been saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceWater"
    put:
      operationId: setSourceWater
      tags: [settings]
      summary: Save or clear the source (tap) water profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceWater"
      responses:
        "200":
          description: Saved source water
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceWater"

  /settings/reading-retention:
    get:
      operationId: getReadingRetention
      tags: [settings]
      summary: Get the reading retention window
      responses:
        "200":
          description: Current reading retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRetentionResponse"
    put:
      operationId: setReadingRetention
      tags: [settings]
      summary: Set the reading retention window
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReadingRetentionBody"
      responses:
        "200":
          description: Updated reading retention setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadingRetentionResponse"

  /settings/brewery-name:
    get:
      operationId: getBreweryName
      tags: [settings]
      summary: Get the brewery name
      responses:
        "200":
          description: Current brewery name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreweryNameResponse"
    put:
      operationId: setBreweryName
      tags: [settings]
      summary: Set the brewery name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreweryNameBody"
      responses:
        "200":
          description: Updated brewery name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreweryNameResponse"

  /settings/default-readings-shown:
    get:
      operationId: getDefaultReadingsShown
      tags: [settings]
      summary: Get the default fermentation readings shown count
      responses:
        "200":
          description: Default readings shown count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultReadingsShownResponse"
    put:
      operationId: setDefaultReadingsShown
      tags: [settings]
      summary: Set the default fermentation readings shown count
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefaultReadingsShownBody"
      responses:
        "200":
          description: Updated default readings shown count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DefaultReadingsShownResponse"

  /settings/ferment-temp-unit:
    get:
      operationId: getFermentTempUnit
      tags: [settings]
      summary: Get the fermentation temperature unit preference
      responses:
        "200":
          description: Current fermentation temperature unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FermentTempUnitResponse"
    put:
      operationId: setFermentTempUnit
      tags: [settings]
      summary: Set the fermentation temperature unit preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FermentTempUnitBody"
      responses:
        "200":
          description: Updated fermentation temperature unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FermentTempUnitResponse"

  /settings/temp-alert-readings:
    get:
      operationId: getTempAlertReadings
      tags: [settings]
      summary: Get the consecutive out-of-range readings before alerting
      responses:
        "200":
          description: Current temp alert readings count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempAlertReadingsResponse"
    put:
      operationId: setTempAlertReadings
      tags: [settings]
      summary: Set the consecutive out-of-range readings before alerting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TempAlertReadingsBody"
      responses:
        "200":
          description: Updated temp alert readings count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempAlertReadingsResponse"

  /settings/notifications:
    get:
      operationId: getNotificationSettings
      tags: [settings]
      summary: Get outbound notification settings
      responses:
        "200":
          description: Current notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    put:
      operationId: setNotificationSettings
      tags: [settings]
      summary: Update outbound notification settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
        "400":
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /settings/notifications/test:
    post:
      operationId: sendTestNotification
      tags: [settings]
      summary: Send a test notification on the configured channel
      responses:
        "200":
          description: Delivery result. ok=false carries the reason in error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationTestResult"

  /backup/audit:
    get:
      operationId: getBackupAudit
      tags: [backup]
      summary: Backup coverage audit
      description: >-
        Reports whether every table in the database is classified in
        backup-registry.ts. Coverage below 100% means a table is unaccounted
        for, and POST /admin/update refuses to run in that state. Note that
        excluded tables are still present in the dump file - excluded means
        "not required to be registered", not "kept out of backups".
      responses:
        "200":
          description: Coverage report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupAuditResult"

  /inventory:
    get:
      operationId: listInventory
      tags: [inventory]
      summary: List all inventory items
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/IngredientType"
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Inventory items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
    post:
      operationId: createInventoryItem
      tags: [inventory]
      summary: Add an inventory item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryItemBody"
      responses:
        "201":
          description: Inventory item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"

  /inventory/{id}:
    put:
      operationId: updateInventoryItem
      tags: [inventory]
      summary: Update an inventory item
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInventoryItemBody"
      responses:
        "200":
          description: Updated inventory item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryItem"
    delete:
      operationId: deleteInventoryItem
      tags: [inventory]
      summary: Delete an inventory item
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /equipment:
    get:
      operationId: listEquipment
      tags: [equipment]
      summary: List all equipment
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Equipment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Equipment"
    post:
      operationId: createEquipment
      tags: [equipment]
      summary: Add a piece of equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentBody"
      responses:
        "201":
          description: Created equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"

  /equipment/{id}:
    put:
      operationId: updateEquipment
      tags: [equipment]
      summary: Update a piece of equipment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentBody"
      responses:
        "200":
          description: Updated equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Equipment"
    delete:
      operationId: deleteEquipment
      tags: [equipment]
      summary: Delete a piece of equipment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  # ── Sensor devices ────────────────────────────────────────────────────────
  /sensors/devices:
    get:
      operationId: listSensorDevices
      tags: [sensors]
      summary: List all registered sensor devices with latest reading and assignment
      responses:
        "200":
          description: Sensor device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorDeviceWithStatus"
    post:
      operationId: createSensorDevice
      tags: [sensors]
      summary: Register a new sensor device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSensorDeviceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorDevice"

  /sensors/devices/{id}:
    get:
      operationId: getSensorDevice
      tags: [sensors]
      summary: Get a single sensor device with latest reading and assignment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Sensor device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorDeviceWithStatus"
        "404":
          description: Not found
    put:
      operationId: updateSensorDevice
      tags: [sensors]
      summary: Update a sensor device (rename, notes, enabled)
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSensorDeviceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorDevice"
        "404":
          description: Not found
    delete:
      operationId: deleteSensorDevice
      tags: [sensors]
      summary: Delete a sensor device and all its readings
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /sensors/devices/{id}/assign:
    post:
      operationId: assignSensorDevice
      tags: [sensors]
      summary: Assign a sensor device to a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDeviceBody"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorDeviceWithStatus"
    delete:
      operationId: unassignSensorDevice
      tags: [sensors]
      summary: Unassign a sensor device from its current brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Unassigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorDeviceWithStatus"

  /sensors/devices/{id}/readings:
    get:
      operationId: listSensorReadings
      tags: [sensors]
      summary: List recent readings for a device
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
      responses:
        "200":
          description: Readings list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorReading"

  /brew-sessions/{id}/sensor-telemetry:
    get:
      operationId: getBrewSensorTelemetry
      tags: [sensors]
      summary: Get sensor telemetry and fermentation insights for a brew session
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Brew telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrewSensorTelemetry"

  # ── iSpindel integration ───────────────────────────────────────────────────
  /integrations/ispindel:
    post:
      operationId: ingestISpindelReading
      tags: [integrations]
      summary: Receive telemetry from an iSpindel device (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISpindelPayload"
      responses:
        "200":
          description: Reading accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required: [ok]
        "403":
          description: Invalid token

  /integrations/ispindel/settings:
    get:
      operationId: getISpindelSettings
      tags: [integrations]
      summary: Get iSpindel integration settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISpindelSettings"
    put:
      operationId: updateISpindelSettings
      tags: [integrations]
      summary: Update iSpindel integration settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISpindelSettings"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISpindelSettings"

  /integrations/ispindel/simulate:
    post:
      operationId: simulateISpindelReading
      tags: [integrations]
      summary: Simulate an iSpindel reading for developer testing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateReadingBody"
      responses:
        "200":
          description: Simulated reading accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  readingId:
                    type: integer
                required: [ok, readingId]

  /integrations/ispindel/status:
    get:
      operationId: getISpindelStatus
      tags: [integrations]
      summary: Home Assistant friendly — all active sensor devices with latest telemetry
      responses:
        "200":
          description: Active device statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/SensorDeviceWithStatus"
                required: [devices]

  /ha/status:
    get:
      operationId: getHaStatus
      tags: [integrations]
      summary: Home Assistant friendly status — all active sensor devices with full telemetry and fermentation insights
      responses:
        "200":
          description: Active sensor device statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HaStatusResponse"

  /integrations/ispindel/devices/{deviceId}/readings:
    get:
      operationId: listISpindelDeviceReadings
      tags: [integrations]
      summary: List paginated readings for an iSpindel device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: start
          in: query
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          schema:
            type: string
            format: date-time
        - name: brewId
          in: query
          schema:
            type: integer
        - name: sort
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        "200":
          description: Paginated readings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISpindelReadingsPage"

  /system/stats:
    get:
      operationId: getSystemStats
      tags: [system]
      summary: Get live host system stats (CPU, memory, disk, network, temperature)
      responses:
        "200":
          description: Live system stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStats"

  /system/health-history:
    get:
      operationId: getSystemHealthHistory
      tags: [system]
      summary: Get recent periodic system health samples for trend charts
      parameters:
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
            maximum: 336
      responses:
        "200":
          description: Ordered list of samples (oldest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemHealthSample"

  /admin/https:
    get:
      operationId: getHttpsStatus
      tags: [system]
      summary: HTTPS (Caddy front) status, plus the progress of any enable/disable job
      responses:
        "200":
          description: Current HTTPS status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpsStatus"

  /admin/https/enable:
    post:
      operationId: enableHttps
      tags: [system]
      summary: Turn HTTPS on (or re-apply it) on a native install
      description: >
        Starts the root-owned HTTPS helper in the background; poll
        GET /admin/https for progress. Native (install.sh) installs only —
        Docker installs turn HTTPS on through .env.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HttpsEnableBody"
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpsJobStarted"
        "400":
          description: Invalid settings, or not available on this install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An HTTPS job, update or rollback is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/https/disable:
    post:
      operationId: disableHttps
      tags: [system]
      summary: Turn HTTPS off on a native install
      responses:
        "202":
          description: Job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HttpsJobStarted"
        "400":
          description: Not available on this install
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An HTTPS job, update or rollback is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices:
    get:
      operationId: listOutputDevices
      tags: [devices]
      summary: List relay devices with their live state
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OutputDevice"
    post:
      operationId: createOutputDevice
      tags: [devices]
      summary: Add a relay device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOutputDeviceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputDevice"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/probe:
    post:
      operationId: probeOutputDevice
      tags: [devices]
      summary: Check that an address answers as a Shelly Gen1 device, before adding it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProbeOutputDeviceBody"
      responses:
        "200":
          description: Probe result. `ok` is false when the device can't be reached, isn't a Shelly, or rejects the credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeOutputDeviceResult"
        "400":
          description: Invalid address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/{id}:
    get:
      operationId: getOutputDevice
      tags: [devices]
      summary: Get one relay device with its live state
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputDevice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOutputDevice
      tags: [devices]
      summary: Update a relay device. Omit password to keep it, send null to clear it.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOutputDeviceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputDevice"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteOutputDevice
      tags: [devices]
      summary: Remove a relay device. Its probe's sensor history is kept.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "409":
          description: An enabled flow controls this relay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/{id}/relay:
    post:
      operationId: setOutputDeviceRelay
      tags: [devices]
      summary: Switch the relay on or off by hand, optionally for a fixed time
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetOutputDeviceRelayBody"
      responses:
        "200":
          description: Relay switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputDevice"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An enabled flow controls this relay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The device could not be reached or refused the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /devices/{id}/safe-defaults:
    post:
      operationId: applyOutputDeviceSafeDefaults
      tags: [devices]
      summary: Set the relay to come back off after a power cut
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutputDevice"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The device could not be reached or refused the command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flows:
    get:
      operationId: listFlows
      tags: [flows]
      summary: List Brew Flows with any problems and their latest run
      responses:
        "200":
          description: Flow list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flow"
    post:
      operationId: createFlow
      tags: [flows]
      summary: Create a flow. It starts disabled; enable it once it has no problems.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlowBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flows/{id}:
    get:
      operationId: getFlow
      tags: [flows]
      summary: Get one flow
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateFlow
      tags: [flows]
      summary: Update a flow's name, description or graph. An enabled flow only accepts a graph with no problems.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlowBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: Invalid input, or the flow is enabled and the new graph has problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowValidationError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFlow
      tags: [flows]
      summary: Delete a flow. Relays it controlled are switched off.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /flows/{id}/enable:
    post:
      operationId: enableFlow
      tags: [flows]
      summary: Turn a flow on
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "400":
          description: The flow has problems, or a relay it uses belongs to another enabled flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowValidationError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flows/{id}/disable:
    post:
      operationId: disableFlow
      tags: [flows]
      summary: Turn a flow off. Relays it controlled are switched off.
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flows/{id}/run:
    post:
      operationId: runFlow
      tags: [flows]
      summary: Run an enabled schedule flow now, without waiting for its schedule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "202":
          description: Started. The outcome is recorded in the flow's runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunFlowResult"
        "400":
          description: Not an enabled schedule flow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /flows/{id}/runs:
    get:
      operationId: listFlowRuns
      tags: [flows]
      summary: What a flow has done, newest first (kept for 14 days)
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FlowRun"

  /flows/{id}/status:
    get:
      operationId: getFlowStatus
      tags: [flows]
      summary: Live state of a flow — current temperature, which steps are active, fail-safe reason
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowStatus"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    FlowGraph:
      type: object
      description: >-
        A trigger → condition → action tree in the node/edge shape the editor's
        canvas uses. Node types and their config are listed in the README
        (Brew Flows); the server validates them and reports problems per node.
      properties:
        version:
          type: integer
          enum: [1]
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/FlowGraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/FlowGraphEdge"
      required: [version, nodes, edges]

    FlowGraphNode:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - trigger.schedule
            - trigger.temperature
            - condition.compare
            - condition.timeWindow
            - condition.brewStatus
            - control.thermostat
            - action.relay
            - action.notify
            - action.delay
        position:
          type: object
          properties:
            x:
              type: number
            y:
              type: number
          required: [x, y]
        data:
          type: object
          properties:
            config:
              type: object
              additionalProperties: true
          required: [config]
      required: [id, type, position, data]

    FlowGraphEdge:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
      required: [id, source, target]

    FlowProblem:
      type: object
      properties:
        nodeId:
          type: string
          nullable: true
          description: The node the problem is about, or null for the flow as a whole
        message:
          type: string
      required: [nodeId, message]

    FlowValidationError:
      type: object
      properties:
        error:
          type: string
        problems:
          type: array
          items:
            $ref: "#/components/schemas/FlowProblem"
      required: [error, problems]

    Flow:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        graph:
          $ref: "#/components/schemas/FlowGraph"
        kind:
          type: string
          enum: [temperature, schedule]
          nullable: true
          description: Decided by the trigger; null while the graph has problems
        problems:
          type: array
          items:
            $ref: "#/components/schemas/FlowProblem"
        relayDeviceIds:
          type: array
          items:
            type: integer
        lastError:
          type: string
          nullable: true
        lastRun:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/FlowRun"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, description, enabled, graph, kind, problems, relayDeviceIds, lastError, lastRun, createdAt, updatedAt]

    CreateFlowBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        graph:
          $ref: "#/components/schemas/FlowGraph"
      required: [name, graph]

    UpdateFlowBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          nullable: true
        graph:
          $ref: "#/components/schemas/FlowGraph"

    FlowRun:
      type: object
      properties:
        id:
          type: integer
        flowId:
          type: integer
        startedAt:
          type: string
          format: date-time
        trigger:
          type: string
          description: tick, schedule, manual or system
        status:
          type: string
          enum: [ok, skipped, error, failsafe]
        message:
          type: string
        detail:
          type: object
          additionalProperties: true
          nullable: true
      required: [id, flowId, startedAt, trigger, status, message, detail]

    FlowNodeState:
      type: object
      properties:
        active:
          type: boolean
          description: Reached on the last evaluation
        relayOn:
          type: boolean
        reason:
          type: string
          description: Thermostat state, e.g. heating, idle, holding_min_off
      required: [active]

    FlowStatus:
      type: object
      properties:
        flowId:
          type: integer
        running:
          type: boolean
          description: The flow is enabled and loaded by the engine
        kind:
          type: string
          enum: [temperature, schedule]
          nullable: true
        lastTickAt:
          type: string
          format: date-time
          nullable: true
        tempC:
          type: number
          nullable: true
        failsafe:
          type: string
          nullable: true
          description: Why the flow is holding its relays off, if it is
        waiting:
          type: boolean
          description: Waiting for the first readings after a restart
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        nodes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/FlowNodeState"
      required: [flowId, running, kind, lastTickAt, tempC, failsafe, waiting, nextRunAt, nodes]

    RunFlowResult:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
      required: [ok, message]

    OutputDeviceOwner:
      type: object
      properties:
        flowId:
          type: integer
        name:
          type: string
      required: [flowId, name]

    OutputDevice:
      type: object
      properties:
        id:
          type: integer
        deviceType:
          type: string
          enum: [shelly_gen1]
        name:
          type: string
        host:
          type: string
        channel:
          type: integer
        username:
          type: string
          nullable: true
        hasPassword:
          type: boolean
          description: The password itself is never returned
        enabled:
          type: boolean
        probeSensorDeviceId:
          type: integer
          nullable: true
          description: Sensor device that records the add-on probe's temperature, once one has been seen
        lastSeenAt:
          type: string
          format: date-time
          nullable: true
        state:
          $ref: "#/components/schemas/OutputDeviceLiveState"
        controlledBy:
          nullable: true
          description: The enabled flow switching this relay, if any. Manual control is refused while set.
          allOf:
            - $ref: "#/components/schemas/OutputDeviceOwner"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, deviceType, name, host, channel, username, hasPassword, enabled, probeSensorDeviceId, lastSeenAt, state, controlledBy, createdAt, updatedAt]

    OutputDeviceLiveState:
      type: object
      properties:
        reachable:
          type: boolean
        ison:
          type: boolean
          nullable: true
        tempC:
          type: number
          nullable: true
          description: Add-on probe temperature in °C, null when no probe is fitted
        rssi:
          type: integer
          nullable: true
        lastError:
          type: string
          nullable: true
      required: [reachable, ison, tempC, rssi, lastError]

    CreateOutputDeviceBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        host:
          type: string
          minLength: 1
        channel:
          type: integer
          minimum: 0
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      required: [name, host]

    UpdateOutputDeviceBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        host:
          type: string
          minLength: 1
        channel:
          type: integer
          minimum: 0
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        enabled:
          type: boolean

    ProbeOutputDeviceBody:
      type: object
      properties:
        host:
          type: string
          minLength: 1
        username:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      required: [host]

    ProbeOutputDeviceResult:
      type: object
      properties:
        ok:
          type: boolean
        error:
          type: string
          nullable: true
        host:
          type: string
          description: The address as it will be stored
        model:
          type: string
          nullable: true
          description: Shelly model code, e.g. SHSW-1
        authRequired:
          type: boolean
        ison:
          type: boolean
          nullable: true
        tempC:
          type: number
          nullable: true
      required: [ok, error, host, model, authRequired, ison, tempC]

    SetOutputDeviceRelayBody:
      type: object
      properties:
        on:
          type: boolean
        durationSec:
          type: integer
          minimum: 1
          maximum: 86400
          description: Turn back after this many seconds, enforced by the device itself
      required: [on]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    HttpsStatus:
      type: object
      properties:
        installType:
          type: string
          enum: [native, docker]
        enabled:
          type: boolean
          description: >
            Native: the FermentOS Caddy configuration is installed. Docker: the
            Caddy service from docker-compose.https.yml answers.
        caddyRunning:
          type: boolean
        rootCertReachable:
          type: boolean
          description: The CA root is being served on the plain-HTTP port
        ip:
          type: string
          nullable: true
          description: Address the certificate is issued for (native only)
        names:
          type: array
          items:
            type: string
        httpPort:
          type: integer
        httpsPort:
          type: integer
        detectedIps:
          type: array
          description: This host's LAN IPv4 addresses (native only)
          items:
            type: string
        defaultNames:
          type: array
          items:
            type: string
        helper:
          type: string
          enum: [ok, missing, outdated, notApplicable]
          description: >
            Whether the root-owned helper the Settings buttons need is installed
            and allowed by sudoers. missing/outdated are fixed by running the
            repair script once.
        job:
          $ref: "#/components/schemas/HttpsJob"
      required: [installType, enabled, caddyRunning, rootCertReachable, ip, names, httpPort, httpsPort, detectedIps, defaultNames, helper, job]

    HttpsJob:
      type: object
      properties:
        state:
          type: string
          enum: [idle, running, succeeded, failed]
        action:
          type: string
          enum: [enable, disable]
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        logTail:
          type: string
          nullable: true
      required: [state, action, startedAt, finishedAt, logTail]

    HttpsEnableBody:
      type: object
      properties:
        ip:
          type: string
          description: This host's LAN IPv4 address
        names:
          type: array
          maxItems: 5
          items:
            type: string
        httpPort:
          type: integer
          minimum: 1
          maximum: 65535
        httpsPort:
          type: integer
          minimum: 1
          maximum: 65535
      required: [ip]

    HttpsJobStarted:
      type: object
      properties:
        started:
          type: boolean
      required: [started]

    BrewStatus:
      type: string
      enum: [brew_day, fermenting, conditioning, packaged]

    OffFlavor:
      type: string
      description: Common homebrew off-flavor. "None" is an empty offFlavors array rather than a member here.
      enum: [diacetyl, acetaldehyde, dms, phenolic, oxidized, astringent, sour, solvent, sulfur, light_struck]

    PackagingMethod:
      type: string
      nullable: true
      description: How a finished batch was packaged. Null until the batch is packaged.
      enum: [keg, bottle]

    BrewAgain:
      type: string
      nullable: true
      enum: [as_is, with_tweaks, no]

    IngredientType:
      type: string
      enum: [malt, hop, yeast, adjunct, water_agent, other]

    IngredientUse:
      type: string
      enum: [mash, steep, boil, dry_hop, whirlpool, primary, secondary, packaging, other]

    RecipeVariant:
      type: string
      description: A version a kit recipe can be brewed as.
      enum: [lme, dme, all_grain]

    Recipe:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        style:
          type: string
        variants:
          type: array
          nullable: true
          description: The versions this recipe can be brewed as. Null for an ordinary single-version recipe. Set only by import.
          items:
            $ref: "#/components/schemas/RecipeVariant"
        batchSizeGallons:
          type: number
        originalGravity:
          type: number
          nullable: true
        finalGravity:
          type: number
          nullable: true
        abv:
          type: number
          nullable: true
        ibu:
          type: number
          nullable: true
        colorSrm:
          type: number
          nullable: true
        estimatedBrewTimeMinutes:
          type: integer
          nullable: true
        efficiencyPercent:
          type: number
          nullable: true
        caloriesPerServing:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        fermentTempMin:
          type: number
          nullable: true
          description: Minimum fermentation temperature threshold
        fermentTempMax:
          type: number
          nullable: true
          description: Maximum fermentation temperature threshold
        fermentTempIdeal:
          type: number
          nullable: true
          description: Ideal fermentation temperature target
        conditionTempMin:
          type: number
          nullable: true
          description: Minimum conditioning temperature threshold. When no conditioning range is set, temperature alerts are off while conditioning.
        conditionTempMax:
          type: number
          nullable: true
          description: Maximum conditioning temperature threshold
        conditionTempIdeal:
          type: number
          nullable: true
          description: Ideal conditioning temperature target
        daysPlanned:
          type: integer
          nullable: true
        daysBrewing:
          type: integer
          nullable: true
        daysFermenting:
          type: integer
          nullable: true
        daysConditioning:
          type: integer
          nullable: true
        daysPackaged:
          type: integer
          nullable: true
        avgScore:
          type: number
          nullable: true
          description: Mean overallScore across every rated batch of this recipe, 1-10.
        ratedBatchCount:
          type: integer
          description: Batches carrying a scorecard. Always <= batchCount.
        batchCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, name, style, batchSizeGallons, batchCount, ratedBatchCount, createdAt, updatedAt]

    RecipeWithIngredients:
      allOf:
        - $ref: "#/components/schemas/Recipe"
        - type: object
          properties:
            ingredients:
              type: array
              items:
                $ref: "#/components/schemas/RecipeIngredient"
            steps:
              type: array
              items:
                $ref: "#/components/schemas/RecipeStep"
            ratedBatches:
              type: array
              description: Every rated batch brewed from this recipe, oldest first — the recipe's track record.
              items:
                $ref: "#/components/schemas/RatedBatch"
          required: [ingredients, steps, ratedBatches]

    RatedBatch:
      type: object
      properties:
        id:
          type: integer
        brewDate:
          type: string
          format: date
        recipeName:
          type: string
        overallScore:
          type: integer
      required: [id, brewDate, recipeName, overallScore]

    StepPhase:
      type: string
      enum: [mash, boil, fermentation, conditioning, packaging, other]

    RecipeStep:
      type: object
      properties:
        id:
          type: integer
        recipeId:
          type: integer
        position:
          type: integer
          description: 1-based ordering within the recipe
        phase:
          $ref: "#/components/schemas/StepPhase"
          nullable: true
        body:
          type: string
          description: Free-form instruction text (markdown allowed)
        durationMinutes:
          type: integer
          nullable: true
      required: [id, recipeId, position, body]

    CreateRecipeStepBody:
      type: object
      properties:
        body:
          type: string
        phase:
          $ref: "#/components/schemas/StepPhase"
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        position:
          type: integer
          nullable: true
          description: Optional explicit position; if omitted, the step is appended.
      required: [body]

    UpdateRecipeStepBody:
      type: object
      properties:
        body:
          type: string
        phase:
          $ref: "#/components/schemas/StepPhase"
          nullable: true
        durationMinutes:
          type: integer
          nullable: true
        position:
          type: integer

    ReorderRecipeStepsBody:
      type: object
      properties:
        stepIds:
          type: array
          items:
            type: integer
          description: Step IDs in the new desired order. Must contain every step ID belonging to the recipe.
      required: [stepIds]

    CreateRecipeBody:
      type: object
      properties:
        name:
          type: string
        style:
          type: string
        batchSizeGallons:
          type: number
        originalGravity:
          type: number
          nullable: true
        finalGravity:
          type: number
          nullable: true
        abv:
          type: number
          nullable: true
        ibu:
          type: number
          nullable: true
        colorSrm:
          type: number
          nullable: true
        estimatedBrewTimeMinutes:
          type: integer
          nullable: true
        efficiencyPercent:
          type: number
          nullable: true
        caloriesPerServing:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        fermentTempMin:
          type: number
          nullable: true
          description: Minimum fermentation temperature threshold
        fermentTempMax:
          type: number
          nullable: true
          description: Maximum fermentation temperature threshold
        fermentTempIdeal:
          type: number
          nullable: true
          description: Ideal fermentation temperature target
        conditionTempMin:
          type: number
          nullable: true
          description: Minimum conditioning temperature threshold. When no conditioning range is set, temperature alerts are off while conditioning.
        conditionTempMax:
          type: number
          nullable: true
          description: Maximum conditioning temperature threshold
        conditionTempIdeal:
          type: number
          nullable: true
          description: Ideal conditioning temperature target
        daysPlanned:
          type: integer
          nullable: true
        daysBrewing:
          type: integer
          nullable: true
        daysFermenting:
          type: integer
          nullable: true
        daysConditioning:
          type: integer
          nullable: true
        daysPackaged:
          type: integer
          nullable: true
      required: [name, style, batchSizeGallons]

    UpdateRecipeBody:
      type: object
      properties:
        name:
          type: string
        style:
          type: string
        batchSizeGallons:
          type: number
        originalGravity:
          type: number
          nullable: true
        finalGravity:
          type: number
          nullable: true
        abv:
          type: number
          nullable: true
        ibu:
          type: number
          nullable: true
        colorSrm:
          type: number
          nullable: true
        estimatedBrewTimeMinutes:
          type: integer
          nullable: true
        efficiencyPercent:
          type: number
          nullable: true
        caloriesPerServing:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        fermentTempMin:
          type: number
          nullable: true
          description: Minimum fermentation temperature threshold
        fermentTempMax:
          type: number
          nullable: true
          description: Maximum fermentation temperature threshold
        fermentTempIdeal:
          type: number
          nullable: true
          description: Ideal fermentation temperature target
        conditionTempMin:
          type: number
          nullable: true
          description: Minimum conditioning temperature threshold. When no conditioning range is set, temperature alerts are off while conditioning.
        conditionTempMax:
          type: number
          nullable: true
          description: Maximum conditioning temperature threshold
        conditionTempIdeal:
          type: number
          nullable: true
          description: Ideal conditioning temperature target
        daysPlanned:
          type: integer
          nullable: true
        daysBrewing:
          type: integer
          nullable: true
        daysFermenting:
          type: integer
          nullable: true
        daysConditioning:
          type: integer
          nullable: true
        daysPackaged:
          type: integer
          nullable: true

    RecipeIngredient:
      type: object
      properties:
        id:
          type: integer
        recipeId:
          type: integer
        name:
          type: string
        type:
          $ref: "#/components/schemas/IngredientType"
        amount:
          type: number
        unit:
          type: string
        use:
          $ref: "#/components/schemas/IngredientUse"
          nullable: true
        timingMinutes:
          type: integer
          nullable: true
        dryHopDay:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Dry hops only. Days after the batch enters conditioning to add it,
